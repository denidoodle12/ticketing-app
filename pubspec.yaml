name: ticketing_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.10.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.1.4
  web_socket_channel: ^3.0.1
  http: ^1.2.0

  # Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.0

  # UI & Navigation
  go_router: ^13.0.0
  toastification: ^3.0.3

  # Utilities
  intl: ^0.19.0
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.3
  app_settings: ^5.1.1
  image_picker: ^1.0.7
  image_cropper: ^8.0.2
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  permission_handler: ^11.3.0

  # Pagination
  infinite_scroll_pagination: ^4.1.0

  # Save to Gallery
  gal: ^2.3.0

  # App Info (read version dynamically)
  package_info_plus: ^8.3.0

  # Charts
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # Background Service (Foreground Service for SSE)
  flutter_background_service: ^5.0.12
  flutter_background_service_android: ^6.2.6

  # Password Strength Indicator
  flutter_password_strength: ^0.1.6

  # Firebase
  firebase_core: ^4.4.0
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/images/illustrations/
    - assets/images/chatbot/
    - assets/icons/
    - assets/icons/dashboard/
