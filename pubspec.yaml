name: ticketing_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.1.4

  # Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI & Navigation
  go_router: ^13.0.0
  toastification: ^3.0.3

  # Utilities
  intl: ^0.19.0
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.3
  app_settings: ^5.1.1
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/images/illustrations/
    - assets/icons/
